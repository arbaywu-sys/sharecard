<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推薦分享卡產生工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f1ea;
    margin: 0;
    padding: 24px 16px 60px;
    color: #2b2b2b;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  p.desc {
    font-size: 14px;
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  button {
    background: #b5552c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 17px;
    width: 100%;
    margin-top: 8px;
  }
  button:disabled {
    background: #ccc;
  }
  button:active { opacity: 0.8; }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  canvas {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-top: 12px;
  }
  a.download-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    background: #2f6b4f;
    color: #fff;
    text-decoration: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 17px;
  }
  .hint {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
  }
  .loading {
    font-size: 13px;
    color: #b5552c;
  }
</style>
</head>
<body>

  <h1>推薦分享卡產生工具</h1>
  <p class="desc">輸入推薦人姓名，按「產生」，下方會出現可下載的分享卡圖片。</p>

  <div class="card">
    <input type="text" id="nameInput" placeholder="輸入推薦人姓名，例如：王小明">
    <button id="genBtn" onclick="generateCard()" disabled>圖片載入中...</button>
    <canvas id="cardCanvas" width="1067" height="1599"></canvas>
    <div id="downloadArea"></div>
    <p class="hint">產生後點「下載圖片」即可存到手機，再傳給推薦人。</p>
  </div>

<script>
  const bgImage = new Image();
  let imageReady = false;

  bgImage.onload = function() {
    imageReady = true;
    const btn = document.getElementById('genBtn');
    btn.disabled = false;
    btn.textContent = '產生';
    // 先畫一次空白版底圖讓使用者預覽
    drawBase();
  };
  bgImage.onerror = function() {
    const btn = document.getElementById('genBtn');
    btn.textContent = '底圖載入失敗，請確認 card-bg.png 是否放在同一資料夾';
  };
  bgImage.src = 'card-bg.png';

  function drawBase() {
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  }

  // 空白框的座標範圍（依實際設計圖 1067x1599 量測）
  const BOX = { left: 201, right: 862, top: 407, bottom: 581 };
  const BOX_CENTER_X = (BOX.left + BOX.right) / 2;
  const BOX_CENTER_Y = (BOX.top + BOX.bottom) / 2;
  const BOX_MAX_WIDTH = (BOX.right - BOX.left) * 0.85; // 留一點邊距，避免貼框

  function generateCard() {
    if (!imageReady) return;
    const name = document.getElementById('nameInput').value.trim() || '____';
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    drawBase();

    // 自動依文字長度縮小字級，避免長名字超出空白框
    let fontSize = 60;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${fontSize}px sans-serif`;
    while (ctx.measureText(name).width > BOX_MAX_WIDTH && fontSize > 24) {
      fontSize -= 2;
      ctx.font = `bold ${fontSize}px sans-serif`;
    }

    ctx.fillStyle = '#173821'; // 深綠色，呼應店名顏色
    ctx.fillText(name, BOX_CENTER_X, BOX_CENTER_Y);

    // 產生下載按鈕
    const dataUrl = canvas.toDataURL('image/png');
    const downloadArea = document.getElementById('downloadArea');
    downloadArea.innerHTML = '';
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = '推薦卡_' + name + '.png';
    link.className = 'download-link';
    link.textContent = '下載圖片';
    downloadArea.appendChild(link);
  }
</script>

</body>
</html>
