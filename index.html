<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推薦分享卡產生工具</title>
<style>
  @font-face {
    font-family: 'Iansui';
    src: url('Iansui-Regular.ttf') format('truetype');
    font-display: swap;
  }
</style>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f1ea;
    margin: 0;
    padding: 24px 16px 60px;
    color: #2b2b2b;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  p.desc {
    font-size: 14px;
    color: #666;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  button {
    background: #b5552c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 17px;
    width: 100%;
    margin-top: 8px;
  }
  button:disabled {
    background: #ccc;
  }
  button:active { opacity: 0.8; }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  canvas {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-top: 12px;
  }
  a.download-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    background: #2f6b4f;
    color: #fff;
    text-decoration: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 17px;
  }
  .hint {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
  }
  .loading {
    font-size: 13px;
    color: #b5552c;
  }
</style>
</head>
<body>

  <div style="position:absolute; left:-9999px; top:-9999px; font-family:'Iansui'; font-size:10px;">暖機文字Warmup</div>

  <h1>推薦分享卡產生工具</h1>
  <p class="desc">輸入推薦人姓名，按「產生」，下方會出現可下載的分享卡圖片。</p>

  <div class="card">
    <input type="text" id="nameInput" placeholder="輸入推薦人姓名，例如：王小明">
    <button id="genBtn" onclick="generateCard()" disabled>圖片載入中...</button>
    <canvas id="cardCanvas" width="1067" height="1599" style="display:none;"></canvas>
    <img id="resultImg" style="width:100%; border-radius:8px; margin-top:12px; display:none;">
    <div id="downloadArea"></div>
    <p class="hint" id="saveHint" style="display:none;">📱 長按上方圖片 → 選「儲存圖像」即可存到手機相簿（iPhone適用）。</p>
    <p class="hint">或點下方「下載圖片」按鈕下載（Android / 電腦適用）。</p>
  </div>

<script>
  const bgImage = new Image();
  let imageReady = false;
  let fontReady = false;

  function maybeEnableButton() {
    if (imageReady && fontReady) {
      // 暖機：強迫Canvas先用芫荽體畫一次文字，避開「第一次量字寬不準」的瀏覽器bug
      const canvas = document.getElementById('cardCanvas');
      const ctx = canvas.getContext('2d');
      ctx.font = '112px "Iansui"';
      ctx.fillText('暖', -9999, -9999);

      const btn = document.getElementById('genBtn');
      btn.disabled = false;
      btn.textContent = '產生';
      drawBase();
    }
  }

  bgImage.onload = function() {
    imageReady = true;
    maybeEnableButton();
  };
  bgImage.onerror = function() {
    const btn = document.getElementById('genBtn');
    btn.textContent = '底圖載入失敗，請確認 card-bg.png 是否放在同一資料夾';
  };
  bgImage.src = 'card-bg.png';

  document.fonts.load('112px "Iansui"').then(function() {
    fontReady = true;
    maybeEnableButton();
  }).catch(function() {
    fontReady = true; // 字體載入失敗也放行，自動改用備援字體（PingFang TC / Noto Sans CJK TC）
    maybeEnableButton();
  });

  function drawBase() {
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  }

  // 空白框的座標範圍（依實際設計圖 1067x1599 量測）
  const BOX = { left: 201, right: 862, top: 407, bottom: 581 };
  const BOX_CENTER_X = (BOX.left + BOX.right) / 2;
  const BOX_CENTER_Y = (BOX.top + BOX.bottom) / 2;
  const BOX_MAX_WIDTH = (BOX.right - BOX.left) * 0.78;   // 寬度上限
  const BOX_MAX_HALF_HEIGHT = 52;                         // 高度上限，避免壓到底圖右下角「Excursion Orthotix」字樣

  // 字體後備順序（防呆）：芫荽體沒有的字，自動換下一個字體顯示，不會出現缺字方框
  const FONT_STACK = '"Iansui", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif';

  function measureName(ctx, name, size) {
    ctx.font = `${size}px ${FONT_STACK}`;
    const spacing = size * 0.30;
    let total = 0;
    let halfHeight = 0;
    for (const ch of name) {
      const m = ctx.measureText(ch);
      total += m.width;
      const asc = m.actualBoundingBoxAscent || size * 0.38;
      const desc = m.actualBoundingBoxDescent || size * 0.38;
      halfHeight = Math.max(halfHeight, asc, desc);
    }
    total += spacing * (name.length - 1);
    return { total, halfHeight, spacing };
  }

  function drawNameOnCanvas(ctx, name) {
    let fontSize = 150;
    const minFontSize = 30;
    let m = measureName(ctx, name, fontSize);

    while (fontSize > minFontSize && (m.total > BOX_MAX_WIDTH || m.halfHeight > BOX_MAX_HALF_HEIGHT)) {
      fontSize -= 2;
      m = measureName(ctx, name, fontSize);
    }

    ctx.font = `${fontSize}px ${FONT_STACK}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    // 柔和陰影（輕微立體感，避免太重）
    ctx.shadowColor = 'rgba(80,55,25,0.35)';
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 2;
    ctx.fillStyle = '#8B652E'; // 古銅金

    let x = BOX_CENTER_X - m.total / 2;
    for (const ch of name) {
      ctx.fillText(ch, x, BOX_CENTER_Y);
      x += ctx.measureText(ch).width + m.spacing;
    }

    // 重設陰影，避免影響後續繪製
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
  }

  function generateCard() {
    if (!imageReady) return;
    const name = document.getElementById('nameInput').value.trim() || '____';
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');

    drawBase();
    drawNameOnCanvas(ctx, name);

    canvas.toBlob(function(blob) {
      const url = URL.createObjectURL(blob);

      // 顯示圖片本身（iPhone可長按這張圖儲存，相容性最好）
      const img = document.getElementById('resultImg');
      img.src = url;
      img.style.display = 'block';
      document.getElementById('saveHint').style.display = 'block';

      // 同時提供下載按鈕（Android / 桌機適用）
      const downloadArea = document.getElementById('downloadArea');
      downloadArea.innerHTML = '';
      const link = document.createElement('a');
      link.href = url;
      link.download = '推薦卡_' + name + '.png';
      link.className = 'download-link';
      link.textContent = '下載圖片';
      downloadArea.appendChild(link);
    }, 'image/png');
  }
</script>

</body>
</html>
